name: Update Weekly Astronomy News

on:
  schedule:
    # ساعت 05:30 به وقت گرینویچ (UTC) = دقیقا ساعت 09:00 صبح جمعه به وقت تهران (IRST)
    - cron: '30 5 * * 5'
  workflow_dispatch: # دکمه اجرای دستی برای هر زمان که مایل بودید

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests deep-translator

      - name: Run news update script
        run: |
          python update_news.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update NASA astronomy news [skip ci]" || echo "No changes to commit"
          git push
